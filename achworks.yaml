schemaVersion: achworks.dev/v1alpha1
kind: Component

metadata:
  name: product-interface-designer
  title: Product Interface Designer
  description: Provider-neutral AI Skill for product interface design, UX, visual systems, localization, and cross-platform interface quality.

spec:
  type: ai-design-skill
  lifecycle: active
  system: achworks-engineering
  ownership: AChWorks

  capabilities:
    provides:
      - product-interface-design
      - user-experience-design
      - visual-design-systems
      - interface-quality-review
      - rtl-persian-interface-design
      - cross-platform-interface-guidance
    consumes:
      - ecosystem-governance
      - capability-catalog
      - cross-project-engineering-standards
      - validation-evidence-contract

  documentation:
    path: docs/

  source:
    repository: AChWorks/product-interface-designer
    url: https://github.com/AChWorks/product-interface-designer

  extensions:
    achworks:
      koinon: AChWorks/koinon
